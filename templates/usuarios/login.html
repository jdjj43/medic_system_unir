{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Inicio de sesión
    </title>


    <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">

</head>


<body>


<div class="login-container">



    <div class="logo-container">

        <img 
            src="{% static 'usuarios/img/logo.jpg' %}"
            alt="Logo Universidad"
            class="logo"
        >

    </div>


    <div class="login-box">


        <h1>
            Medic System V1
        </h1>


        <p class="subtitle">
            Inicio de sesión
        </p>



        <form method="POST">

            {% csrf_token %}


            <div class="input-group">

                <label>
                    Usuario
                </label>


                {{ form.username }}

            </div>



            <div class="input-group">

                <label>
                    Contraseña
                </label>


                {{ form.password }}

            </div>



            <button type="submit">

                Ingresar

            </button>


        </form>


    </div>


</div>


</body>

</html>
